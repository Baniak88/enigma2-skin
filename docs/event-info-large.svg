<text x="64" y="328.0" font-size="30" font-weight="normal" fill="#c2ccd7" text-anchor="start">5 lis, 20:00 — 21:30</text>
<text x="1856" y="328.0" font-size="30" font-weight="normal" fill="#c2ccd7" text-anchor="end">90 min</text>
<text x="64" y="424.0" font-size="36" font-weight="normal" fill="#f3f6fa" text-anchor="start">Zapaleńcy. Historia polskiego filmu animowanego</text>
<text x="64" y="469.0" font-size="36" font-weight="normal" fill="#f3f6fa" text-anchor="start"></text>
<text x="64" y="514.0" font-size="36" font-weight="normal" fill="#f3f6fa" text-anchor="start">Dokument pokazuje, jak sztuka animacji odzwierciedla zmieniającą się rzeczywistość</text>
<text x="64" y="559.0" font-size="36" font-weight="normal" fill="#f3f6fa" text-anchor="start">społeczną w Polsce. Film ukazuje ewolucję technik i tematów, które uczyniły polską</text>
<text x="64" y="604.0" font-size="36" font-weight="normal" fill="#f3f6fa" text-anchor="start">animację fenomenem światowym.</text>
<text x="64" y="649.0" font-size="36" font-weight="normal" fill="#f3f6fa" text-anchor="start"></text>
<text x="64" y="694.0" font-size="36" font-weight="normal" fill="#f3f6fa" text-anchor="start">PL, 2024</text>
<text x="64" y="739.0" font-size="36" font-weight="normal" fill="#f3f6fa" text-anchor="start">Reżyseria: Marcin Giżycki</text>
<text x="64" y="784.0" font-size="36" font-weight="normal" fill="#f3f6fa" text-anchor="start">Występują: Zbigniew Rybczyński</text>
<text x="64" y="829.0" font-size="36" font-weight="normal" fill="#f3f6fa" text-anchor="start"></text>
<text x="64" y="874.0" font-size="36" font-weight="normal" fill="#f3f6fa" text-anchor="start">Historia twórców, ich eksperymentów i filmów, które zdobyły uznanie na całym świecie.</text>
