<rect x="1408" y="1012" width="6" height="39" fill="#5eacff" fill-opacity="1.000000"/>
<text x="1430" y="1027.0" font-size="29" font-weight="normal" fill="#f3f6fa" text-anchor="start">EPG wielu kanałów</text>
