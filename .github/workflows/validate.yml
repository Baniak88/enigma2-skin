name: Validate and package TvSat
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install preview dependency
        run: python3 -m pip install Pillow==11.3.0
      - name: Generate skin, assets and previews
        run: |
          python3 scripts/generate_skin.py
          python3 scripts/build_assets.py
          python3 scripts/preview.py --png --thumbnail
      - name: Validate and test actual packages
        run: |
          python3 scripts/validate.py
          sh -n install.sh
          sh -n packaging/postinst
          python3 -m unittest discover -s tests -v
          python3 scripts/check_upstream_fonts.py --download
      - uses: actions/upload-artifact@v4
        with:
          name: verified-tvsat
          if-no-files-found: error
          path: |
            TvSat/
            docs/*.svg
            docs/infobar.png
            docs/setup.png
            dist/*.tar.gz
            dist/*.ipk
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: verified-tvsat
      - name: Publish tested generated files and packages
        run: |
          mkdir -p packages
          cp dist/*.tar.gz dist/*.ipk packages/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- TvSat docs/*.svg packages
          git add -f -- docs/infobar.png docs/setup.png
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Build tested TvSat packages and previews [skip ci]"
          git push origin HEAD:main
